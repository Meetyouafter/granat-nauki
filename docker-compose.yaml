services:
  frontend:
    container_name: granat-nauki_frontend
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./frontend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  admin:
    container_name: granat-nauki_admin
    build: ./admin
    ports:
      - "3001:3001"
    volumes:
      - ./admin:/app
      - /app/node_modules
    env_file:
      - ./admin/.env
    depends_on:
      - frontend
    networks:
      - app-network

  db:
    container_name: granat-nauki_db
    image: postgres:18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE}
    volumes:
      - db-data:/var/lib/postgresql
    networks:
      - app-network

# логи
  dozzle:
    image: amir20/dozzle:latest
    container_name: granat-nauki_dozzle
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network


volumes:
  db-data:

networks:
  app-network:
    driver: bridge