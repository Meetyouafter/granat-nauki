name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prizma generate
        run: pnpm --filter main exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/granat

      - name: check
        run: pnpm check